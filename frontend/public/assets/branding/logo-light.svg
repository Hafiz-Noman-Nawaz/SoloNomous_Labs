<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" fill="none" class="solonomous-logo-light">
  <defs>
    <linearGradient id="purpleGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="flaskLiquidLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Minimalist Laboratory Flask Icon with Bubbles -->
  <g transform="translate(6, 6)">
    <path d="M 20 8 L 20 16 L 10 34 C 8 38 11 42 15 42 L 33 42 C 37 42 40 38 38 34 L 28 16 L 28 8" 
          stroke="url(#purpleGradLight)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="17" y1="8" x2="31" y2="8" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 13 33 Q 19 30 24 32 T 35 33 C 36.5 36 35 40 32 40 L 16 40 C 13 40 11.5 36 13 33 Z" 
          fill="url(#flaskLiquidLight)" />
    <!-- Emerging Bubbles -->
    <circle cx="24" cy="17" r="1.8" fill="#7C3AED" />
    <circle cx="21" cy="11" r="2.2" fill="#8B5CF6" />
    <circle cx="27" cy="5" r="1.5" fill="#A78BFA" />
    <circle cx="23" cy="-1" r="1.1" fill="#C4B5FD" />
  </g>

  <!-- Typography -->
  <g transform="translate(54, 32)">
    <text font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.02em">
      <tspan fill="#7C3AED">Solo</tspan><tspan fill="#0F172A">Nomous</tspan>
    </text>
    <!-- Subtitle: Labs -->
    <text x="1" y="14" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="0.28em" fill="#64748B">
      LABS
    </text>
  </g>
</svg>
